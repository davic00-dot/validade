<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controle de Validade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161b24;
    --surface2: #1e2736;
    --border: #2a3548;
    --accent: #00e5a0;
    --accent2: #0099ff;
    --warn: #ff6b35;
    --danger: #ff3b5c;
    --text: #e8edf5;
    --muted: #6b7a96;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--surface) 0%, #0d1520 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 38px; height: 38px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .header-count {
    margin-left: auto;
    background: var(--accent);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 12px 16px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* SECTIONS */
  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* FORM */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .form-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-card h3::before {
    content: '';
    width: 3px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field input::placeholder { color: var(--muted); font-size: 13px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* BARCODE AREA */
  .barcode-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .barcode-row .field { flex: 1; margin-bottom: 0; }
  .scan-btn {
    height: 44px;
    padding: 0 14px;
    background: var(--accent2);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .scan-btn:active { opacity: 0.8; }

  /* CAMERA MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .camera-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
  }
  #video {
    width: 100%;
    border-radius: 12px;
    display: block;
    background: #000;
  }
  .scan-frame {
    position: absolute;
    inset: 20%;
    border: 2px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
  }
  .scan-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0.8;
    animation: scanMove 2s linear infinite;
  }
  @keyframes scanMove {
    0% { top: 0; }
    50% { top: calc(100% - 2px); }
    100% { top: 0; }
  }
  .scan-hint {
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    text-align: center;
    margin-top: 20px;
    padding: 0 20px;
  }
  .scan-hint small { color: var(--muted); font-size: 12px; display: block; margin-top: 4px; }
  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    padding: 0 20px;
  }
  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s;
  }
  .modal-btn.cancel { background: var(--surface2); color: var(--text); }
  .modal-btn.manual { background: var(--accent); color: #000; }

  /* TIPO VALIDADE */
  .tipo-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tipo-btn {
    padding: 10px;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    transition: all 0.2s;
    text-align: center;
  }
  .tipo-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .validity-section { display: none; }
  .validity-section.active { display: block; }

  /* ADD BUTTON */
  .add-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: 0.3px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .add-btn:active { opacity: 0.85; transform: scale(0.99); }

  /* PRODUCT LIST */
  .list-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .list-controls input {
    flex: 1;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
  }
  .list-controls input:focus { border-color: var(--accent); }
  .filter-btn {
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .select-all-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .select-all-row span {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    flex: 1;
  }
  .select-all-row .sel-count {
    font-size: 12px;
    color: var(--accent);
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 8px;
    position: relative;
    transition: border-color 0.2s;
  }
  .product-card.selected {
    border-color: var(--accent);
    background: rgba(0,229,160,0.05);
  }
  .product-card.vencido { border-left: 3px solid var(--danger); }
  .product-card.critico { border-left: 3px solid var(--warn); }
  .product-card.ok { border-left: 3px solid var(--accent); }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card-check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    margin-top: 2px;
    background: var(--bg);
  }
  .product-card.selected .card-check {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card-check::after {
    content: '✓';
    color: #000;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }
  .product-card.selected .card-check::after { display: block; }

  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-ean {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .card-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .card-delete:active { color: var(--danger); }

  .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .stat-box {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .stat-box .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .stat-box .value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .stat-box .value.danger { color: var(--danger); }
  .stat-box .value.warn { color: var(--warn); }
  .stat-box .value.ok { color: var(--accent); }

  .qty-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    outline: none;
    text-align: center;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-input:focus { border-color: var(--accent2); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty p { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 6px; color: var(--text); }
  .empty small { font-size: 12px; }

  /* EXPORT SECTION */
  .export-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .export-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .export-info {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .export-info strong { color: var(--accent); }
  .export-btns { display: grid; gap: 10px; }
  .exp-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
  }
  .exp-btn:active { opacity: 0.8; transform: scale(0.99); }
  .exp-btn .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .exp-btn.excel .icon { background: rgba(0,200,100,0.15); }
  .exp-btn.whatsapp .icon { background: rgba(37,211,102,0.15); }
  .exp-btn.backup .icon { background: rgba(0,153,255,0.15); }
  .exp-btn .desc { text-align: left; }
  .exp-btn .desc strong {
    display: block;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .exp-btn .desc small {
    font-size: 11px;
    color: var(--muted);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: #000;
    padding: 12px 22px;
    border-radius: 30px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    z-index: 9999;
    transition: transform 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,229,160,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); box-shadow: 0 8px 32px rgba(255,59,92,0.3); }

  /* SORT CONTROLS */
  .sort-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .sort-row::-webkit-scrollbar { display: none; }
  .sort-chip {
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .sort-chip.active { background: var(--surface2); color: var(--text); border-color: var(--accent2); }

  /* summary bar */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .sum-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .sum-item .num {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 2px;
  }
  .sum-item .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .sum-item.danger .num { color: var(--danger); }
  .sum-item.warn .num { color: var(--warn); }
  .sum-item.ok .num { color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">📦</div>
  <div>
    <h1>Validades</h1>
    <p>Controle de vencimentos</p>
  </div>
  <div class="header-count" id="totalCount">0</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('cadastro')">➕ Cadastrar</button>
  <button class="tab" onclick="showTab('lista')">📋 Lista</button>
  <button class="tab" onclick="showTab('exportar')">📤 Exportar</button>
</div>

<!-- ========== CADASTRAR ========== -->
<div class="section active" id="tab-cadastro">

  <div class="form-card">
    <h3>Produto</h3>

    <div class="field">
      <label>Nome do Produto</label>
      <input type="text" id="nomeProduto" placeholder="Ex: Leite Integral 1L" autocomplete="off">
    </div>

    <div class="field">
      <label>Código EAN</label>
      <div class="barcode-row">
        <div class="field" style="margin-bottom:0;">
          <input type="text" id="codigoEAN" placeholder="7891234567890" inputmode="numeric" autocomplete="off" oninput="onEanInput(this.value)">
        </div>
        <button class="scan-btn" onclick="openCamera()" title="Escanear código de barras">📷</button>
      </div>
      <div id="eanStatus" style="display:none; margin-top:6px; font-size:12px; padding:8px 10px; border-radius:8px;"></div>
    </div>

    <div class="field">
      <label>Quantidade <span style="color:var(--muted);font-size:10px;">(opcional)</span></label>
      <input type="number" id="qtdProduto" placeholder="Ex: 10" min="0" inputmode="numeric" autocomplete="off">
    </div>
  </div>

  <div class="form-card">
    <h3>Validade</h3>

    <div class="tipo-toggle">
      <button class="tipo-btn active" id="btnTipoData" onclick="setTipo('data')">📅 Data fixa</button>
      <button class="tipo-btn" id="btnTipoFab" onclick="setTipo('fabricacao')">🏭 A partir fabricação</button>
    </div>

    <!-- Data fixa -->
    <div class="validity-section active" id="secData">
      <!-- sub-toggle: dia completo vs só mês/ano -->
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <button class="tipo-btn active" id="btnDiaCompleto" onclick="setDataMode('completo')" style="font-size:11px;padding:7px 10px;">📅 Dia/Mês/Ano</button>
        <button class="tipo-btn" id="btnMesAno" onclick="setDataMode('mesano')" style="font-size:11px;padding:7px 10px;">📆 Mês/Ano</button>
      </div>
      <!-- Dia + Mês + Ano -->
      <div class="row3" id="modoCompleto">
        <div class="field">
          <label>Dia</label>
          <input type="number" id="vencDia" placeholder="DD" min="1" max="31" inputmode="numeric">
        </div>
        <div class="field">
          <label>Mês</label>
          <input type="number" id="vencMes" placeholder="MM" min="1" max="12" inputmode="numeric">
        </div>
        <div class="field">
          <label>Ano</label>
          <input type="number" id="vencAno" placeholder="AAAA" min="2020" max="2099" inputmode="numeric">
        </div>
      </div>
      <!-- Só Mês + Ano (vence no último dia do mês) -->
      <div class="row2" id="modoMesAno" style="display:none;">
        <div class="field">
          <label>Mês</label>
          <input type="number" id="vencMesSo" placeholder="MM" min="1" max="12" inputmode="numeric">
        </div>
        <div class="field">
          <label>Ano</label>
          <input type="number" id="vencAnoSo" placeholder="AAAA" min="2020" max="2099" inputmode="numeric">
        </div>
      </div>
      <div id="previewMesAno" style="display:none; margin-top:6px; padding:8px 10px; background:var(--bg); border-radius:8px; font-size:12px; color:var(--accent);">
        📅 Vence no último dia do mês selecionado
      </div>
    </div>

    <!-- A partir da fabricação -->
    <div class="validity-section" id="secFab">
      <div class="row2">
        <div class="field">
          <label>Fabricação — Dia</label>
          <input type="number" id="fabDia" placeholder="DD" min="1" max="31" inputmode="numeric">
        </div>
        <div class="field">
          <label>Fabricação — Mês</label>
          <input type="number" id="fabMes" placeholder="MM" min="1" max="12" inputmode="numeric">
        </div>
      </div>
      <div class="row2">
        <div class="field">
